<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" width="1280" height="680">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="mTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="mAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="1280" height="680" fill="url(#bg3)"/>

  <!-- Header -->
  <rect x="40" y="28" width="1200" height="74" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
  <text x="64" y="58" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#10b981" letter-spacing="1.2">DBMARKETER.COM  |  ANALYTICS ENGINEERING &amp; BIGQUERY ML LINEAGE</text>
  <text x="64" y="83" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Governed Medallion Data Flow: Operational JSON → Bronze → Silver → Gold → BQML</text>
  <rect x="980" y="46" width="236" height="36" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="1098" y="69" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#fcd34d">CONCEPTUAL ARCHITECTURE</text>

  <!-- Bronze -->
  <rect x="45" y="160" width="265" height="410" rx="12" fill="#111827" stroke="#d97706" stroke-width="1.6"/>
  <rect x="45" y="160" width="265" height="44" rx="12" fill="#78350f" fill-opacity="0.45"/>
  <text x="65" y="188" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#fcd34d">BRONZE • stg_nutrition_events</text>
  <text x="65" y="232" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Immutable Ingestion View</text>
  <text x="65" y="258" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">• Filters `operation != 'DELETE'`</text>
  <text x="65" y="280" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">• Extracts `tenant_id` (NOT NULL)</text>
  <text x="65" y="302" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">• Dual timestamps:</text>
  <text x="78" y="322" font-family="Consolas, monospace" font-size="11" fill="#fde68a">event_timestamp (UTC)</text>
  <text x="78" y="340" font-family="Consolas, monospace" font-size="11" fill="#fde68a">ingested_at (UTC)</text>
  <text x="65" y="368" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">• Retains raw JSON blocks for</text>
  <text x="78" y="386" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">non-destructive replay</text>
  <rect x="65" y="495" width="225" height="52" rx="8" fill="#090d16" stroke="#334155"/>
  <text x="177" y="517" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#94a3b8">Materialization: VIEW</text>
  <text x="177" y="535" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#fcd34d">Grain: 1 row per event_id</text>

  <!-- Silver -->
  <rect x="350" y="160" width="275" height="410" rx="12" fill="#111827" stroke="#38bdf8" stroke-width="1.6"/>
  <rect x="350" y="160" width="275" height="44" rx="12" fill="#0c4a6e" fill-opacity="0.45"/>
  <text x="370" y="188" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#7dd3fc">SILVER • int_events_flattened</text>
  <text x="370" y="232" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Typed 0/1 Flag Standardization</text>
  <text x="370" y="258" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">• Unnests `ingredients[].tags`</text>
  <text x="370" y="282" font-family="Consolas, monospace" font-size="11" fill="#7dd3fc">has_high_fodmap_polyol (0/1)</text>
  <text x="370" y="302" font-family="Consolas, monospace" font-size="11" fill="#7dd3fc">has_hydrocolloid_gum (0/1)</text>
  <text x="370" y="322" font-family="Consolas, monospace" font-size="11" fill="#7dd3fc">has_emulsifier_irritant (0/1)</text>
  <text x="370" y="342" font-family="Consolas, monospace" font-size="11" fill="#7dd3fc">has_unverified_gluten_risk (0/1)</text>
  <text x="370" y="362" font-family="Consolas, monospace" font-size="11" fill="#7dd3fc">is_raw_plant_prep (0/1)</text>
  <text x="370" y="390" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">• Standardizes outcome label:</text>
  <text x="380" y="410" font-family="Consolas, monospace" font-size="11" fill="#fda4af">is_elevated_discomfort (&gt;=7)</text>
  <rect x="370" y="495" width="235" height="52" rx="8" fill="#090d16" stroke="#334155"/>
  <text x="487" y="517" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#94a3b8">Materialization: VIEW</text>
  <text x="487" y="535" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#7dd3fc">100% Contract Parity w/ Zod</text>

  <!-- Gold -->
  <rect x="665" y="160" width="285" height="410" rx="12" fill="#111827" stroke="#10b981" stroke-width="1.8"/>
  <rect x="665" y="160" width="285" height="44" rx="12" fill="#064e3b" fill-opacity="0.55"/>
  <text x="685" y="188" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#6ee7b7">GOLD • fct_ml_feature_store</text>
  <text x="685" y="232" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Leakage-Safe Rolling Lag Mart</text>
  <text x="685" y="258" font-family="Consolas, monospace" font-size="11" fill="#fcd34d">PARTITION BY tenant_id</text>
  <text x="685" y="278" font-family="Consolas, monospace" font-size="11" fill="#fcd34d">ORDER BY event_epoch_sec ASC</text>
  <text x="685" y="298" font-family="Consolas, monospace" font-size="11" fill="#34d399">RANGE BETWEEN 86400 PRECEDING</text>
  <text x="685" y="316" font-family="Consolas, monospace" font-size="11" fill="#34d399">          AND 1 PRECEDING</text>
  <text x="685" y="348" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">• Excludes CURRENT ROW so same-</text>
  <text x="695" y="366" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">timestamp logs never leak</text>
  <text x="685" y="390" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">• Computes 24h &amp; 48h cumulative</text>
  <text x="695" y="408" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">additive &amp; context exposures</text>
  <rect x="685" y="495" width="245" height="52" rx="8" fill="#090d16" stroke="#334155"/>
  <text x="807" y="517" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#94a3b8">TABLE • Partition: event_date_utc</text>
  <text x="807" y="535" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#34d399">Cluster: tenant_id, category</text>

  <!-- BQML Consumers -->
  <rect x="990" y="160" width="250" height="190" rx="12" fill="#111827" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="1010" y="192" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#f59e0b">BQML • BOOSTED_TREE_CLASSIFIER</text>
  <text x="1010" y="218" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Feature Association Model</text>
  <text x="1010" y="244" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">• `data_split_method = 'SEQ'`</text>
  <text x="1010" y="266" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">• `ML.GLOBAL_EXPLAIN` weights</text>
  <text x="1010" y="288" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">• Paired with collinearity &amp;</text>
  <text x="1020" y="306" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">95% CI risk-ratio checks</text>
  <text x="1010" y="332" font-family="Consolas, monospace" font-size="11" fill="#fde68a">Non-Causal Hypothesis Ranking</text>

  <rect x="990" y="380" width="250" height="190" rx="12" fill="#111827" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="1010" y="412" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#38bdf8">BQML • ARIMA_PLUS</text>
  <text x="1010" y="438" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Daily Baseline &amp; Anomaly</text>
  <text x="1010" y="464" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">• `time_series_id_col=tenant_id`</text>
  <text x="1010" y="486" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">• Models `daily_max_discomfort`</text>
  <text x="1010" y="508" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">• Flags above-band flare days</text>
  <text x="1010" y="546" font-family="Consolas, monospace" font-size="11" fill="#7dd3fc">Longitudinal Baseline Band</text>

  <!-- Arrows -->
  <line x1="310" y1="365" x2="345" y2="365" stroke="#10b981" stroke-width="2.2" marker-end="url(#mTeal)"/>
  <line x1="625" y1="365" x2="660" y2="365" stroke="#10b981" stroke-width="2.2" marker-end="url(#mTeal)"/>
